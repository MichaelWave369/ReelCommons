name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  test-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Companion stdlib tests
        run: python -m unittest discover -s companion -p 'test_*.py'
      - name: Install
        run: npm install --no-audit --no-fund
      - name: Unit tests
        run: npm test
      - name: Playback trust gate policy
        run: npx vitest run src/playbackTrustGate.test.tsx
      - name: Type check and build
        run: npm run build
